name: Static site and motion regression
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository and web assets
        run: python3 scripts/verify_repo.py
      - name: Install browser testing dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Test WAAPI motion in Chromium
        run: python3 tests/test_motion_browser.py
